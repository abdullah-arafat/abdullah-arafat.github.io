<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Life in Weeks (70 Years)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .header h1 {
      font-size: 15pt;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hover-display {
      font-size: 8pt;
      font-weight: 400;
      color: #000;
      background: transparent;
      border: none;
      padding: 0;
      min-height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.2px;
    }

    .controls {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #fff;
      border: 1px solid #000;
      padding: 4px 10px;
      font-size: 7.5pt;
      border-radius: 4px;
      cursor: pointer;
      color: #000;
      font-weight: 500;
    }

    .btn:hover {
      background: #000;
      color: #fff;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      max-width: 680px;
    }

    .top-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-left: 20px;
      padding-right: 0px;
    }

    .week-labels {
      display: flex;
      justify-content: space-between;
      font-size: 6pt;
      color: #000;
      flex: 1;
    }

    .year-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .year-label {
      width: 18px;
      font-size: 6pt;
      color: #000;
      text-align: right;
      padding-right: 4px;
      font-variant-numeric: tabular-nums;
    }

    .weeks-row {
      display: flex;
      flex: 1;
      gap: 3px;
    }

    .box {
      flex: 1;
      aspect-ratio: 1;
      border: 0.6px solid #000;
      border-radius: 0.5px;
      cursor: pointer;
      position: relative;
    }

    .box:hover {
      border-color: #000;
      outline: 1.5px solid #000;
      z-index: 10;
    }

    .box.filled {
      background-color: #000;
      border-color: #000;
    }

    .box.has-note::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40%;
      height: 40%;
      border-radius: 50%;
      background-color: #fff;
      z-index: 5;
    }
    
    .box.filled.has-note::after {
      background-color: #fff;
    }

    .footer {
      text-align: center;
      font-size: 8pt;
      color: #000;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .info-bar {
      font-size: 7pt;
      color: #000;
      background-color: transparent;
      padding: 4px 12px;
      display: inline-block;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 320px;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    @media print {
      body {
        background-color: #fff;
        padding: 0;
      }
      .no-print, .controls {
        display: none !important;
      }
      .box:hover {
        outline: none;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Life in Weeks</h1>
    <div id="hoverDisplay" class="hover-display">70 Years (3,640 Weeks)</div>
  </div>

  <div class="controls no-print">
    <button onclick="selectTillToday()" class="btn">Select Till Today</button>
    <button onclick="clearAll()" class="btn">Clear All</button>
  </div>

  <div class="grid-container" id="grid">
    <div class="top-header-row">
      <div class="week-labels">
        <span>Week 1</span>
        <span>10</span>
        <span>20</span>
        <span>30</span>
        <span>40</span>
        <span>52</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Selected: <strong id="filledCount">0</strong> weeks &nbsp;|&nbsp; Remaining: <strong id="remainingCount">3,640</strong> weeks</p>
    <div class="info-bar no-print">
      Hover: View Info &nbsp;&middot;&nbsp; 1 Click: Toggle Fill &nbsp;&middot;&nbsp; 2 Clicks: Edit Event
    </div>
  </div>

  <div id="noteModal" class="modal-overlay no-print">
    <div class="modal-card">
      <div style="padding:12px 16px; border-bottom:1px solid #000; background:#fff; display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:12px; font-weight:700; color:#000; text-transform:uppercase;">Edit Week Event</h3>
        <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; color:#000; font-size:16px; font-weight:bold;">&times;</button>
      </div>
      <div style="padding:16px;">
        <div id="modalDateDisplay" style="font-size:10.5pt; color:#000; font-weight:600; background:#fff; border-bottom:1px solid #000; padding-bottom:6px; margin-bottom:12px;"></div>
        <textarea id="eventText" rows="4" style="width:100%; border:1px solid #000; border-radius:2px; padding:8px; font-size:11px; outline:none; resize:none; background:#fff; color:#000;" placeholder="Write your milestones, memories, or notes here..."></textarea>
      </div>
      <div style="padding:10px 16px; background:#fff; border-top:1px solid #000; display:flex; justify-content:end; gap:8px;">
        <button onclick="closeModal()" class="btn" style="padding:4px 10px;">Cancel</button>
        <button onclick="saveNote()" class="btn" style="background:#000; color:#fff; border-color:#000; padding:4px 10px;">Save Event</button>
      </div>
    </div>
  </div>

  <script>
    const dob = new Date(1998, 2, 9); // March 9, 1998
    const today = new Date();
    const msPerWeek = 1000 * 60 * 60 * 24 * 7;
    const weeksLivedTillToday = Math.floor((today - dob) / msPerWeek);
    const totalYears = 70;
    const totalWeeks = totalYears * 52;

    const weekData = Array.from({ length: totalWeeks }, (_, i) => ({
      filled: i < weeksLivedTillToday, 
      note: ''
    }));

    const grid = document.getElementById('grid');
    const filledCountEl = document.getElementById('filledCount');
    const remainingCountEl = document.getElementById('remainingCount');
    const hoverDisplay = document.getElementById('hoverDisplay');
    
    const noteModal = document.getElementById('noteModal');
    const modalDateDisplay = document.getElementById('modalDateDisplay');
    const eventText = document.getElementById('eventText');
    let currentEditIndex = -1;
    let clickTimer = null;

    const boxElements = [];

    function generateGrid() {
      let weekCounter = 0;

      for (let year = 0; year < totalYears; year++) {
        const row = document.createElement('div');
        row.className = 'year-row';

        const label = document.createElement('div');
        label.className = 'year-label';
        label.textContent = year;
        row.appendChild(label);

        const weeksRow = document.createElement('div');
        weeksRow.className = 'weeks-row';

        for (let week = 0; week < 52; week++) {
          const box = document.createElement('div');
          box.className = 'box';
          box.dataset.index = weekCounter;
          
          if (weekData[weekCounter].filled) box.classList.add('filled');
          if (weekData[weekCounter].note) box.classList.add('has-note');

          weeksRow.appendChild(box);
          boxElements.push(box);
          weekCounter++;
        }

        row.appendChild(weeksRow);
        grid.appendChild(row);
      }
    }

    function getWeekInfoText(index) {
      const weekStartDate = new Date(dob.getTime() + index * msPerWeek);
      const weekEndDate = new Date(weekStartDate.getTime() + (6 * 24 * 60 * 60 * 1000));
      
      const startStr = weekStartDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const endStr = weekEndDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      
      const yearStr = Math.floor(index / 52);
      const weekStr = (index % 52) + 1;
      
      let text = `Year ${yearStr}, Week ${weekStr} (${startStr} – ${endStr})`;
      if (weekData[index].note) {
        text += ` — "${weekData[index].note}"`;
      }
      return text;
    }

    function updateCounts() {
      const filled = weekData.filter(w => w.filled).length;
      filledCountEl.textContent = filled.toLocaleString();
      remainingCountEl.textContent = (totalWeeks - filled).toLocaleString();
    }

    function renderBoxState(index) {
      const box = boxElements[index];
      const data = weekData[index];
      
      if (data.filled) box.classList.add('filled');
      else box.classList.remove('filled');
      
      if (data.note.trim() !== '') box.classList.add('has-note');
      else box.classList.remove('has-note');
    }

    grid.addEventListener('mouseover', (e) => {
      if (e.target.classList.contains('box')) {
        const index = parseInt(e.target.dataset.index);
        hoverDisplay.textContent = getWeekInfoText(index);
      }
    });

    grid.addEventListener('mouseout', (e) => {
      if (e.target.classList.contains('box')) {
        hoverDisplay.textContent = "70 Years (3,640 Weeks)";
      }
    });

    grid.addEventListener('click', (e) => {
      if (e.target.classList.contains('box')) {
        const index = parseInt(e.target.dataset.index);
        
        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
          weekData[index].filled = !weekData[index].filled;
          renderBoxState(index);
          updateCounts();
          clickTimer = null;
        }, 250);
      }
    });

    grid.addEventListener('dblclick', (e) => {
      if (e.target.classList.contains('box')) {
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = null;
        }
        const index = parseInt(e.target.dataset.index);
        openModal(index);
      }
    });

    function openModal(index) {
      currentEditIndex = index;
      const data = weekData[index];
      
      const weekStartDate = new Date(dob.getTime() + index * msPerWeek);
      const weekEndDate = new Date(weekStartDate.getTime() + (6 * 24 * 60 * 60 * 1000));
      const startStr = weekStartDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const endStr = weekEndDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const yearStr = Math.floor(index / 52);
      const weekStr = (index % 52) + 1;

      modalDateDisplay.textContent = `Year ${yearStr}, Week ${weekStr} (${startStr} – ${endStr})`;
      eventText.value = data.note || '';
      
      noteModal.classList.add('active');
      setTimeout(() => eventText.focus(), 50);
    }

    function closeModal() {
      noteModal.classList.remove('active');
      currentEditIndex = -1;
    }

    function saveNote() {
      if (currentEditIndex > -1) {
        weekData[currentEditIndex].note = eventText.value;
        renderBoxState(currentEditIndex);
      }
      closeModal();
    }

    eventText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        saveNote();
      }
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    function selectTillToday() {
      weekData.forEach((data, i) => {
        data.filled = (i < weeksLivedTillToday);
        renderBoxState(i);
      });
      updateCounts();
    }

    function clearAll() {
      weekData.forEach((data, i) => {
        data.filled = false;
        renderBoxState(i);
      });
      updateCounts();
    }

    generateGrid();
    updateCounts();
  </script>
</body>
</html>
