<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #json-editor { font-family: monospace; white-space: pre; }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        
        <div class="bg-slate-800 text-white p-6">
            <h1 class="text-2xl font-bold">Portfolio Admin Panel</h1>
            <p class="text-sm text-slate-300 mt-1">Edit your data.json and commit directly to GitHub.</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <!-- Credentials Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">GitHub Personal Access Token</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-slate-500 mt-1">Requires 'repo' scope. Saved only in your browser.</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">Repository Name</label>
                    <input type="text" id="gh-repo" placeholder="username/repository" value="abdullah-arafat/abdullah-arafat.github.io" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Action bar -->
            <div class="flex items-center justify-between">
                <button id="btn-load" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md font-medium transition-colors">
                    Load Current Data
                </button>
                <div id="status-msg" class="text-sm font-medium"></div>
            </div>

            <!-- Editor Section -->
            <div class="flex flex-col h-[500px]">
                <label class="block text-sm font-semibold mb-2 text-slate-700 flex justify-between">
                    <span>Edit data.json</span>
                    <button id="btn-format" class="text-blue-600 hover:underline text-xs">Format JSON</button>
                </label>
                <textarea id="json-editor" class="flex-1 w-full p-4 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 resize-none text-sm" placeholder="Click 'Load Current Data' to fetch your portfolio details..."></textarea>
            </div>

            <!-- Save Section -->
            <div class="pt-4 border-t border-slate-200 flex flex-col md:flex-row items-center gap-4">
                <input type="text" id="commit-msg" placeholder="Commit message (e.g., Updated publications)" value="Update portfolio data via Admin Panel" class="flex-1 w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="btn-save" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-md font-bold transition-colors">
                    Save to GitHub
                </button>
            </div>

        </div>
    </div>

    <script>
        const elToken = document.getElementById('gh-token');
        const elRepo = document.getElementById('gh-repo');
        const elEditor = document.getElementById('json-editor');
        const elMsg = document.getElementById('status-msg');
        const elCommit = document.getElementById('commit-msg');
        
        let currentSha = null;

        // Load saved credentials from localStorage
        if(localStorage.getItem('gh_admin_token')) {
            elToken.value = localStorage.getItem('gh_admin_token');
        }
        if(localStorage.getItem('gh_admin_repo')) {
            elRepo.value = localStorage.getItem('gh_admin_repo');
        }

        // Save credentials when typed
        elToken.addEventListener('input', () => localStorage.setItem('gh_admin_token', elToken.value));
        elRepo.addEventListener('input', () => localStorage.setItem('gh_admin_repo', elRepo.value));

        function showStatus(text, type='text-slate-600') {
            elMsg.textContent = text;
            elMsg.className = `text-sm font-medium ${type}`;
            setTimeout(() => { elMsg.textContent = ''; }, 5000);
        }

        // Safe Base64 encoding/decoding for Unicode characters (Emojis, Quotes, etc)
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }
        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        document.getElementById('btn-format').addEventListener('click', () => {
            try {
                const parsed = JSON.parse(elEditor.value);
                elEditor.value = JSON.stringify(parsed, null, 2);
                showStatus("JSON formatted successfully.", "text-green-600");
            } catch(e) {
                showStatus("Invalid JSON. Fix errors before formatting.", "text-red-600");
            }
        });

        document.getElementById('btn-load').addEventListener('click', async () => {
            const token = elToken.value.trim();
            const repo = elRepo.value.trim();
            
            if(!token || !repo) {
                showStatus("Please enter your Token and Repository Name.", "text-red-600");
                return;
            }

            elEditor.value = "Loading...";
            elEditor.disabled = true;

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!res.ok) {
                    throw new Error(`GitHub API Error: ${res.status} ${res.statusText}`);
                }

                const data = await res.json();
                currentSha = data.sha; // Save SHA required for updates
                
                // Decode from base64
                const content = b64_to_utf8(data.content);
                
                // Parse and pretty-print JSON
                elEditor.value = JSON.stringify(JSON.parse(content), null, 2);
                showStatus("Data loaded successfully!", "text-green-600");

            } catch(e) {
                console.error(e);
                elEditor.value = "";
                showStatus(e.message, "text-red-600");
            } finally {
                elEditor.disabled = false;
            }
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            const token = elToken.value.trim();
            const repo = elRepo.value.trim();
            const content = elEditor.value;
            const message = elCommit.value.trim() || "Update portfolio data via Admin Panel";
            
            if(!token || !repo) {
                showStatus("Please enter your Token and Repository Name.", "text-red-600");
                return;
            }

            if(!currentSha) {
                showStatus("Please load the current data first!", "text-red-600");
                return;
            }

            // Validate JSON before saving
            try {
                JSON.parse(content);
            } catch(e) {
                showStatus("Invalid JSON. Please fix syntax errors before saving.", "text-red-600");
                return;
            }

            showStatus("Saving to GitHub...", "text-blue-600");

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        content: utf8_to_b64(content), // encode to base64
                        sha: currentSha
                    })
                });

                if (!res.ok) {
                    throw new Error(`Failed to save: ${res.status} ${res.statusText}`);
                }

                const data = await res.json();
                currentSha = data.content.sha; // Update SHA for subsequent saves
                showStatus("Successfully saved to GitHub!", "text-green-600");

            } catch(e) {
                console.error(e);
                showStatus(e.message, "text-red-600");
            }
        });
    </script>
</body>
</html>
