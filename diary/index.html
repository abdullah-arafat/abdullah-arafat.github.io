<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>My Personal Diary</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      color: #000; 
      background-color: #fff; 
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
    }

    .btn {
      background: #fff; border: 1px solid #000; padding: 8px 16px;
      font-size: 9pt; font-weight: 600; cursor: pointer; text-transform: uppercase;
      letter-spacing: 0.5px; transition: all 0.2s; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; border-radius: 4px;
    }
    
    .btn:hover { background: #000; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-icon { padding: 6px 10px; font-size: 14pt; border: none; }
    .btn-icon:hover { background: #f0f0f0; color: #000; }

    .app-container { display: flex; width: 100%; height: 100%; }

    .sidebar {
      width: 350px; min-width: 300px; border-right: 1px solid #000;
      display: flex; flex-direction: column; background: #fff; z-index: 10;
    }

    .sidebar-header {
      padding: 24px 16px 16px; border-bottom: 2px solid #000;
      display: flex; justify-content: space-between; align-items: center;
    }

    .sidebar-header h1 { font-size: 14pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .entry-list { flex: 1; overflow-y: auto; }

    .entry-item {
      padding: 16px; border-bottom: 1px solid #e0e0e0; cursor: pointer;
      display: flex; flex-direction: column; gap: 6px; transition: background-color 0.1s;
    }

    .entry-item:hover { background-color: #f9f9f9; }
    .entry-item.active { background-color: #000; color: #fff; }
    .entry-item.active .entry-preview { color: #ccc; }

    .entry-date { font-size: 9pt; font-weight: 700; text-transform: uppercase; }
    .entry-title { font-size: 11pt; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-preview {
      font-size: 9pt; color: #666; line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .empty-state { padding: 32px 16px; text-align: center; font-size: 9pt; color: #666; font-style: italic; }

    .editor-pane { flex: 1; display: flex; flex-direction: column; background: #fff; }

    .editor-header {
      padding: 16px 24px; border-bottom: 1px solid #e0e0e0;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }

    .date-picker-wrapper { display: flex; align-items: center; gap: 12px; }
    .date-input {
      font-family: inherit; font-size: 12pt; font-weight: 600;
      border: 1px dashed transparent; padding: 4px 8px; outline: none; cursor: pointer; border-radius: 4px;
    }
    .date-input:focus, .date-input:hover { border-color: #000; }

    .editor-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .mobile-back-btn { display: none; }

    .textarea-wrapper { flex: 1; padding: 0; display: flex; position: relative; }
    .editor-textarea {
      flex: 1; width: 100%; resize: none; border: none; padding: 32px 48px;
      font-family: inherit; font-size: 16px; /* 16px prevents iOS zoom on focus */
      line-height: 1.6; outline: none; background: transparent;
    }

    .no-selection {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #888; font-size: 10pt; text-transform: uppercase;
      letter-spacing: 1px; gap: 12px; text-align: center; padding: 20px;
    }

    .sync-status {
      padding: 12px 16px; border-top: 1px solid #e0e0e0; font-size: 8pt; font-weight: 600; text-transform: uppercase;
      display: flex; justify-content: space-between; align-items: center;
      background: #fafafa; cursor: pointer;
    }
    .sync-status:hover { background: #f0f0f0; }
    .sync-indicator { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.connected { background: #00cc00; }
    .dot.error { background: #cc0000; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center;
      justify-content: center; z-index: 100;
    }
    .modal {
      background: #fff; width: 400px; max-width: 90%; padding: 24px;
      border: 2px solid #000; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; gap: 16px; border-radius: 4px;
    }
    .modal h2 { font-size: 14pt; text-transform: uppercase; margin-bottom: 4px; }
    .modal label { font-size: 9pt; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
    .modal input { padding: 10px; border: 1px solid #ccc; font-family: inherit; font-size: 16px; border-radius: 4px; }
    .modal input:focus { border-color: #000; outline: none; }
    .modal-actions { display: flex; justify-content: space-between; margin-top: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #000; color: #fff; padding: 10px 24px; border-radius: 6px;
      font-size: 10pt; font-weight: 600; letter-spacing: 0.5px; z-index: 9999;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .mic-active { color: #ff4444 !important; border-color: #ff4444 !important; animation: pulse 1.5s infinite; }
    .lang-select { background: #fff; border: 1px solid #ccc; padding: 6px; font-size: 8pt; font-weight: 600; cursor: pointer; border-radius: 4px; outline: none; }
    .lang-select:focus { border-color: #000; }

    @media (max-width: 768px) {
      .app-container.viewing-entry .sidebar { display: none; }
      .app-container:not(.viewing-entry) .editor-pane { display: none; }
      .sidebar { width: 100%; min-width: 100%; }
      .mobile-back-btn { display: flex; }
      .editor-textarea { padding: 20px 16px; }
      .editor-header { padding: 12px 16px; }
      .editor-actions { width: 100%; justify-content: space-between; margin-top: 8px; }
      .date-picker-wrapper { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div id="app" class="app-container">
    
    <!-- Left Sidebar: Inbox List -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Diary</h1>
        <button id="newEntryBtn" class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New
        </button>
      </div>
      <div id="entryList" class="entry-list">
        <!-- Entries injected via JS -->
      </div>
      <div id="syncSettingsBtn" class="sync-status">
        <div class="sync-indicator">
          <div id="statusDot" class="dot"></div>
          <span id="statusText">Not Connected</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>

    <!-- Right Content: Editor -->
    <div id="editorPane" class="editor-pane" style="display: none;">
      <div class="editor-header">
        <div class="date-picker-wrapper">
          <button id="backBtn" class="btn btn-icon mobile-back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <input type="date" id="entryDate" class="date-input">
        </div>
        <div class="editor-actions">
          <span id="syncingIndicator" style="font-size:8pt; color:#666; display:none;">Syncing...</span>
          
          <select id="dictationLang" class="lang-select" title="Dictation Language">
            <option value="bn-BD">BN</option>
            <option value="en-US">EN</option>
          </select>
          <button id="micBtn" class="btn" title="Start Dictation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>

          <button id="deleteBtn" class="btn" style="border-color: #ff4444; color: #ff4444;" title="Delete Entry">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
          <button id="saveBtn" class="btn">Commit Save</button>
        </div>
      </div>
      <div class="textarea-wrapper">
        <textarea id="entryText" class="editor-textarea" placeholder="Start writing... (এখানে লেখা শুরু করুন...)"></textarea>
      </div>
    </div>

    <!-- Empty State for Editor Pane -->
    <div id="noSelectionPane" class="no-selection">
      <div style="font-weight: 600; color: #000;">Private Diary of Abdullah Arafat</div>
      <div>Select an entry or create a new one to begin writing.</div>
    </div>

  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <h2>Private Diary Login</h2>
      <p style="font-size: 9pt; color: #555;">This diary is completely private. You must provide a valid Personal Access Token to view or edit entries.</p>
      
      <label>
        Data Repository
        <input type="text" id="ghRepoInput" placeholder="username/repo">
      </label>
      
      <label>
        Personal Access Token (PAT)
        <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </label>

      <div class="modal-actions">
        <button id="logoutModalBtn" class="btn" style="border-color: transparent; color: #ff4444; padding: 8px; display: none;">Logout</button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button id="closeModalBtn" class="btn" style="border-color: transparent;">Cancel</button>
          <button id="saveModalBtn" class="btn">Login & Load</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastEl" class="toast"></div>

  <script>
    let diaryData = {};
    let activeDate = null;
    let isEditingNew = false; 
    let fileSha = null;

    const DEFAULT_REPO = 'abdullah-arafat/diary-data';
    let ghToken = localStorage.getItem('gh_token') || '';
    let ghRepo = localStorage.getItem('gh_repo') || '';
    const FILE_PATH = 'diary_entries.json';

    const appContainer = document.getElementById('app');
    const entryListEl = document.getElementById('entryList');
    const editorPane = document.getElementById('editorPane');
    const noSelectionPane = document.getElementById('noSelectionPane');
    
    const newEntryBtn = document.getElementById('newEntryBtn');
    const backBtn = document.getElementById('backBtn');
    const saveBtn = document.getElementById('saveBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    
    const entryDateInput = document.getElementById('entryDate');
    const entryTextarea = document.getElementById('entryText');
    const toastEl = document.getElementById('toastEl');

    const settingsModal = document.getElementById('settingsModal');
    const syncSettingsBtn = document.getElementById('syncSettingsBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');
    const logoutModalBtn = document.getElementById('logoutModalBtn');
    
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const syncingIndicator = document.getElementById('syncingIndicator');
    
    const micBtn = document.getElementById('micBtn');
    const dictationLang = document.getElementById('dictationLang');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      // Using interimResults helps mobile users know the mic is active
      recognition.interimResults = true; 
      // continuous = true can be buggy on some mobile OS, but we catch the disconnect in onend
      recognition.continuous = true; 

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('mic-active');
        showToast("Listening... (Speak now)");
      };

      recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }
        
        if (finalTranscript) {
          const currentVal = entryTextarea.value;
          const needsSpace = currentVal.length > 0 && !currentVal.endsWith(' ') && !currentVal.endsWith('\n');
          entryTextarea.value = currentVal + (needsSpace ? ' ' : '') + finalTranscript;
          entryTextarea.scrollTop = entryTextarea.scrollHeight;
        }
      };

      recognition.onerror = (event) => {
        if(event.error !== 'no-speech') {
          console.warn("Microphone error: " + event.error);
        }
        stopDictation();
      };

      recognition.onend = () => {
        // Mobile browsers often force-stop the mic during pauses.
        // We gracefully clean up the UI so it doesn't look "stuck".
        stopDictation();
      };
    }

    function stopDictation() {
      isRecording = false;
      micBtn.classList.remove('mic-active');
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return showToast("Dictation not supported in this browser (Use Chrome/Safari).");
      
      if (isRecording) {
        stopDictation();
        showToast("Dictation stopped.");
      } else {
        recognition.lang = dictationLang.value;
        try {
          recognition.start();
        } catch (e) {
          console.error("Recognition already started.");
        }
      }
    });

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.opacity = '1';
      setTimeout(() => toastEl.style.opacity = '0', 3000);
    }

    function formatDateFriendly(dateStr) {
      const [y, m, d] = dateStr.split('-');
      const dateObj = new Date(y, m - 1, d);
      return dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseTextForPreview(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return { title: 'Empty Entry', preview: '...' };
      const title = lines[0];
      const preview = lines.length > 1 ? lines.slice(1).join(' ') : '...';
      return { title, preview };
    }

    function encodeUnicodeBase64(str) {
      return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
    }
    
    function decodeUnicodeBase64(b64) {
      const binString = atob(b64);
      const bytes = new Uint8Array(binString.length);
      for (let i = 0; i < binString.length; i++) { bytes[i] = binString.charCodeAt(i); }
      return new TextDecoder().decode(bytes);
    }

    function setStatus(state, msg) {
      statusText.textContent = msg;
      statusDot.className = 'dot';
      if (state === 'connected') statusDot.classList.add('connected');
      if (state === 'error') statusDot.classList.add('error');
    }

    async function fetchFromGitHub() {
      if (!ghToken) {
        setStatus('error', 'Login Required');
        diaryData = {};
        renderList();
        settingsModal.style.display = 'flex';
        return;
      }
      
      const targetRepo = ghRepo || DEFAULT_REPO;
      setStatus('connecting', 'Fetching data...');
      
      try {
        const response = await fetch(`https://api.github.com/repos/${targetRepo}/contents/${FILE_PATH}`, {
          headers: {
            'Authorization': `token ${ghToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          diaryData = {};
          fileSha = null;
          setStatus('connected', 'Repo Connected (Empty)');
          renderList();
          return;
        }

        if (response.status === 401) {
          throw new Error("Unauthorized. Token is invalid or expired.");
        }

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        fileSha = data.sha; 
        
        const decodedContent = decodeUnicodeBase64(data.content);
        diaryData = JSON.parse(decodedContent);
        
        setStatus('connected', 'Connected securely');
        renderList();
      } catch (error) {
        console.error(error);
        setStatus('error', 'Connection Failed');
        showToast(error.message);
      }
    }

    async function saveToGitHub() {
      if (!ghToken) {
        settingsModal.style.display = 'flex';
        return false;
      }

      const targetRepo = ghRepo || DEFAULT_REPO;
      syncingIndicator.style.display = 'inline';
      
      const jsonContent = JSON.stringify(diaryData, null, 2);
      const base64Content = encodeUnicodeBase64(jsonContent);

      const body = {
        message: `Diary Update: ${activeDate || 'Multiple'}`,
        content: base64Content
      };
      
      if (fileSha) body.sha = fileSha;

      try {
        const response = await fetch(`https://api.github.com/repos/${targetRepo}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${ghToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || 'Failed to save to GitHub');
        }

        const data = await response.json();
        fileSha = data.content.sha;
        
        syncingIndicator.style.display = 'none';
        setStatus('connected', 'Connected securely');
        return true;
      } catch (error) {
        console.error(error);
        syncingIndicator.style.display = 'none';
        setStatus('error', 'Save Failed');
        showToast("Failed to save: " + error.message);
        return false;
      }
    }

    function renderList() {
      entryListEl.innerHTML = '';
      
      if (!ghToken) {
        entryListEl.innerHTML = `<div class="empty-state">Secure Diary Locked.<br>Please login to access entries.</div>`;
        return;
      }

      const dates = Object.keys(diaryData).sort((a, b) => new Date(b) - new Date(a));
      
      if (dates.length === 0 && !isEditingNew) {
        entryListEl.innerHTML = `<div class="empty-state">No entries yet.<br>Click "New" to start writing.</div>`;
        return;
      }

      dates.forEach(date => {
        const text = diaryData[date];
        const { title, preview } = parseTextForPreview(text);
        
        const item = document.createElement('div');
        item.className = `entry-item ${date === activeDate && !isEditingNew ? 'active' : ''}`;
        item.innerHTML = `
          <div class="entry-date">${formatDateFriendly(date)}</div>
          <div class="entry-title">${title}</div>
          <div class="entry-preview">${preview}</div>
        `;
        item.addEventListener('click', () => openEntry(date));
        entryListEl.appendChild(item);
      });
    }

    function showEditor() {
      noSelectionPane.style.display = 'none';
      editorPane.style.display = 'flex';
      appContainer.classList.add('viewing-entry');
    }

    function hideEditor() {
      stopDictation(); 
      noSelectionPane.style.display = 'flex';
      editorPane.style.display = 'none';
      appContainer.classList.remove('viewing-entry');
      activeDate = null;
      isEditingNew = false;
      renderList();
    }

    function openEntry(date) {
      if (!ghToken) return;
      activeDate = date;
      isEditingNew = false;
      entryDateInput.value = date;
      entryTextarea.value = diaryData[date];
      showEditor();
      renderList();
    }

    function createNewEntry() {
      if (!ghToken) {
        settingsModal.style.display = 'flex';
        return;
      }

      let targetDate = getTodayString();
      if (diaryData[targetDate]) showToast("Note: An entry for today already exists.");
      
      activeDate = targetDate;
      isEditingNew = true;
      entryDateInput.value = targetDate;
      entryTextarea.value = '';
      
      showEditor();
      renderList();
      entryTextarea.focus();
    }

    async function handleSaveEntry() {
      const date = entryDateInput.value;
      const text = entryTextarea.value.trim();
      
      if (!date) return showToast("Please select a date.");
      if (!text) return showToast("Entry cannot be empty.");

      const originalBtnText = saveBtn.textContent;
      saveBtn.textContent = 'Committing...';
      saveBtn.disabled = true;

      if (activeDate && activeDate !== date && !isEditingNew) {
        delete diaryData[activeDate];
      }

      diaryData[date] = text;
      activeDate = date;
      isEditingNew = false;
      
      renderList();
      const success = await saveToGitHub();
      
      saveBtn.disabled = false;
      if (success) {
        saveBtn.textContent = 'Committed!';
        setTimeout(() => saveBtn.textContent = originalBtnText, 1500);
      } else {
        saveBtn.textContent = originalBtnText;
      }
    }

    async function handleDeleteEntry() {
      if (activeDate && diaryData[activeDate]) {
        delete diaryData[activeDate];
        hideEditor();
        showToast("Deleting & Committing to GitHub...");
        await saveToGitHub();
      } else {
        hideEditor();
      }
    }

    newEntryBtn.addEventListener('click', createNewEntry);
    backBtn.addEventListener('click', hideEditor);
    saveBtn.addEventListener('click', handleSaveEntry);
    deleteBtn.addEventListener('click', handleDeleteEntry);

    syncSettingsBtn.addEventListener('click', () => {
      document.getElementById('ghRepoInput').value = ghRepo;
      document.getElementById('ghTokenInput').value = ghToken;
      
      logoutModalBtn.style.display = ghToken ? 'block' : 'none';
      saveModalBtn.textContent = ghToken ? 'Update Token' : 'Login & Load';

      settingsModal.style.display = 'flex';
    });

    logoutModalBtn.addEventListener('click', () => {
      ghToken = '';
      localStorage.removeItem('gh_token');
      document.getElementById('ghTokenInput').value = '';
      
      settingsModal.style.display = 'none';
      showToast("Logged out successfully.");
      
      hideEditor(); 
      fetchFromGitHub(); // Will trigger the locked state
    });

    closeModalBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    saveModalBtn.addEventListener('click', () => {
      ghRepo = document.getElementById('ghRepoInput').value.trim();
      ghToken = document.getElementById('ghTokenInput').value.trim();
      
      if (!ghToken) return showToast("A Personal Access Token is required to access the diary.");

      localStorage.setItem('gh_repo', ghRepo);
      localStorage.setItem('gh_token', ghToken);
      
      settingsModal.style.display = 'none';
      fetchFromGitHub();
    });

    // Boot up
    fetchFromGitHub();
  </script>
</body>
</html>
